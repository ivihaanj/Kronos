<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronos — Elite Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── Variables ───────────────────────────────────────────── */
:root {
  --bg:          #0B0F19;
  --bg2:         #0F1623;
  --bg3:         #141C2E;
  --card:        rgba(15,22,35,0.85);
  --card2:       rgba(20,28,46,0.9);
  --border:      rgba(255,255,255,0.07);
  --border2:     rgba(255,255,255,0.12);
  --text1:       #F1F5F9;
  --text2:       #94A3B8;
  --text3:       #4B5563;
  --emerald:     #10B981;
  --emerald-dim: rgba(16,185,129,0.12);
  --cyan:        #06B6D4;
  --cyan-dim:    rgba(6,182,212,0.1);
  --amber:       #F59E0B;
  --rose:        #F43F5E;
  --purple:      #A78BFA;
  --indigo:      #6366F1;
  --blue:        #3B82F6;
  --teal:        #14B8A6;
  --orange:      #F97316;
  --radius:      14px;
  --radius-sm:   8px;
}

/* ─── Reset ───────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text1);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 14px;
  line-height: 1.5;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 10%, rgba(16,185,129,0.055) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 85%, rgba(6,182,212,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ─── Layout ──────────────────────────────────────────────── */
#app { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 0 16px 80px; }

/* ─── Header ──────────────────────────────────────────────── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 14px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(to bottom, rgba(11,15,25,0.98) 80%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin: 0 -16px; padding: 20px 16px 14px;
}
.header-brand { display: flex; flex-direction: column; gap: 2px; }
.brand-logo {
  font-size: 20px; font-weight: 800; letter-spacing: 0.12em;
  background: linear-gradient(135deg, var(--cyan) 0%, var(--emerald) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-sub { font-size: 10px; font-weight: 500; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; }

.header-clock { text-align: center; }
.live-clock {
  font-size: 22px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text1); font-variant-numeric: tabular-nums;
}
.live-date { font-size: 11px; color: var(--text3); font-weight: 500; text-align: center; margin-top: 2px; }

.btn-notif {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: 9999px;
  border: 1px solid var(--border2); background: var(--card);
  color: var(--text2); cursor: pointer; font-size: 12px; font-weight: 600;
  font-family: inherit; transition: all 0.2s; letter-spacing: 0.02em;
}
.btn-notif svg { width: 14px; height: 14px; flex-shrink: 0; }
.btn-notif:hover { border-color: rgba(6,182,212,0.35); color: var(--cyan); }
.btn-notif.active {
  border-color: rgba(16,185,129,0.5); color: var(--emerald);
  background: rgba(16,185,129,0.08);
  box-shadow: 0 0 16px rgba(16,185,129,0.1);
}

/* ─── Day Navigation ──────────────────────────────────────── */
.day-nav {
  display: flex; gap: 8px; padding: 18px 0 4px;
  overflow-x: auto; scrollbar-width: none;
}
.day-nav::-webkit-scrollbar { display: none; }

.day-tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 16px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--card);
  color: var(--text2); cursor: pointer; font-family: inherit;
  transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
  position: relative;
}
.day-tab:hover { border-color: var(--border2); color: var(--text1); }
.day-tab.active {
  border-color: rgba(6,182,212,0.4); background: rgba(6,182,212,0.07);
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(6,182,212,0.1), inset 0 0 20px rgba(6,182,212,0.04);
}
.tab-label { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
.tab-sub { font-size: 10px; font-weight: 400; opacity: 0.7; }
.tab-today {
  position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
  background: var(--cyan); color: #000;
  font-size: 8px; font-weight: 800; letter-spacing: 0.1em;
  padding: 1px 6px; border-radius: 9999px;
}

/* ─── Metrics Panel ───────────────────────────────────────── */
.metrics-panel {
  display: flex; align-items: center; gap: 20px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  margin: 14px 0 20px;
}
.progress-ring-wrap {
  position: relative; flex-shrink: 0;
  width: 100px; height: 100px;
}
.progress-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 8; }
.ring-fill {
  fill: none;
  stroke: url(#ringGrad);
  stroke-width: 8; stroke-linecap: round;
  transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);
}
.ring-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-pct { font-size: 20px; font-weight: 800; color: var(--text1); }
.ring-sub { font-size: 10px; color: var(--text3); font-weight: 500; }

.metrics-stats { display: flex; gap: 20px; flex: 1; }
.stat-item { display: flex; flex-direction: column; gap: 3px; }
.stat-val { font-size: 22px; font-weight: 800; color: var(--text1); line-height: 1; }
.stat-val span { font-size: 14px; color: var(--text3); font-weight: 400; }
.stat-lbl { font-size: 10px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }

.current-block-banner {
  display: none; align-items: center; gap: 10px;
  background: rgba(6,182,212,0.06); border: 1px solid rgba(6,182,212,0.2);
  border-radius: var(--radius-sm); padding: 10px 14px;
  flex-shrink: 0; min-width: 160px;
}
.banner-icon { color: var(--cyan); font-size: 11px; }
.banner-label { font-size: 12px; font-weight: 600; color: var(--cyan); }
.banner-next { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ─── Schedule List ───────────────────────────────────────── */
.schedule-list { display: flex; flex-direction: column; gap: 6px; }

.block-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 12px 12px 16px;
  transition: all 0.25s; position: relative; overflow: hidden;
  cursor: default;
}
.block-item::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--type-color, var(--text3));
  border-radius: 0 2px 2px 0;
}
.block-item:hover { border-color: var(--border2); }

.block-item.active {
  border-color: rgba(6,182,212,0.35);
  background: rgba(6,182,212,0.04);
  box-shadow: 0 0 30px rgba(6,182,212,0.08), inset 0 0 30px rgba(6,182,212,0.02);
}
.block-item.active::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

.block-item.completed { opacity: 0.55; }
.block-item.completed .block-label { text-decoration: line-through; text-decoration-color: var(--emerald); }

/* Center: body */
.block-body {
  display: flex; align-items: center; gap: 10px; flex: 1;
}
.block-type-icon { font-size: 18px; flex-shrink: 0; filter: saturate(0.9); }
.block-info { display: flex; flex-direction: column; gap: 3px; }
.block-label { font-size: 14px; font-weight: 600; color: var(--text1); line-height: 1.2; }
.block-item.active .block-label { color: var(--cyan); }
.block-time {
  font-size: 11px; font-weight: 500; color: var(--text3);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
}
.block-item.active .block-time { color: rgba(6,182,212,0.7); }
.block-countdown {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; color: var(--cyan);
  background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2);
  padding: 2px 8px; border-radius: 9999px; width: fit-content;
}
.block-countdown::before { content: '▶'; font-size: 8px; }
.block-note-preview {
  font-size: 11px; color: var(--text3); font-style: italic;
  max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Right: actions */
.block-right {
  display: flex; align-items: center; gap: 8px;
  padding-right: 2px; flex-shrink: 0;
}
.btn-note {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: inherit; transition: all 0.2s; position: relative;
}
.btn-note svg { width: 13px; height: 13px; }
.btn-note:hover { color: var(--cyan); border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.05); }
.btn-note.has-note { color: var(--amber); border-color: rgba(245,158,11,0.3); }
.note-dot {
  position: absolute; top: 4px; right: 4px;
  width: 5px; height: 5px; background: var(--amber); border-radius: 50%;
}

.block-check-wrap { display: flex; align-items: center; cursor: pointer; }
.block-check { position: absolute; opacity: 0; width: 0; height: 0; }
.check-custom {
  width: 22px; height: 22px; border-radius: 6px;
  border: 1.5px solid var(--border2); background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.check-custom svg { width: 12px; height: 12px; stroke: transparent; transition: stroke 0.15s; }
.block-check:checked + .check-custom {
  background: var(--emerald); border-color: var(--emerald);
  box-shadow: 0 0 10px rgba(16,185,129,0.3);
}
.block-check:checked + .check-custom svg { stroke: #000; }
.block-check-wrap:hover .check-custom { border-color: var(--emerald); }

.sleep-icon { font-size: 18px; opacity: 0.5; width: 30px; text-align: center; }

/* ─── Toast ───────────────────────────────────────────────── */
.toast-wrap {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 9999; pointer-events: none;
}
.toast {
  padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; max-width: 320px;
  border: 1px solid transparent;
  transform: translateY(20px); opacity: 0;
  transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(12px);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast-success { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: #6EE7B7; }
.toast-info    { background: rgba(6,182,212,0.12);  border-color: rgba(6,182,212,0.3);  color: #67E8F9; }
.toast-error   { background: rgba(244,63,94,0.12);  border-color: rgba(244,63,94,0.3);  color: #FDA4AF; }

/* ─── Note Modal ──────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay[hidden] { display: none !important; }

.modal-box {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 18px; width: 100%; max-width: 480px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  overflow: hidden;
  animation: slideUp 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 15px; font-weight: 700; color: var(--text1); }
.modal-close {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); cursor: pointer; font-size: 16px; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--border); color: var(--text1); }
.modal-body { padding: 16px 20px; }
#noteTextarea {
  width: 100%; height: 130px; resize: vertical;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); color: var(--text1);
  font-family: inherit; font-size: 13px; padding: 12px;
  outline: none; transition: border-color 0.2s; line-height: 1.6;
}
#noteTextarea:focus { border-color: rgba(6,182,212,0.4); }
#noteTextarea::placeholder { color: var(--text3); }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 20px 18px;
}
.btn-clear {
  padding: 9px 18px; border-radius: var(--radius-sm);
  border: 1px solid var(--border2); background: transparent;
  color: var(--text3); cursor: pointer; font-family: inherit; font-size: 13px;
  font-weight: 500; transition: all 0.15s;
}
.btn-clear:hover { color: var(--text1); border-color: var(--border2); }
.btn-save {
  padding: 9px 22px; border-radius: var(--radius-sm);
  border: 1px solid rgba(6,182,212,0.4); background: rgba(6,182,212,0.1);
  color: var(--cyan); cursor: pointer; font-family: inherit; font-size: 13px;
  font-weight: 600; transition: all 0.15s;
}
.btn-save:hover { background: rgba(6,182,212,0.18); box-shadow: 0 0 16px rgba(6,182,212,0.15); }

/* ─── Scrollbar ───────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text3); border-radius: 4px; }

/* ─── Section Header ──────────────────────────────────────── */
.section-label {
  font-size: 11px; font-weight: 700; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin: 0 0 10px 4px;
}

/* ─── Responsive ──────────────────────────────────────────── */
@media (max-width: 600px) {
  .metrics-panel { flex-wrap: wrap; }
  .metrics-stats { gap: 14px; }
  .current-block-banner { min-width: 100%; }
}
@media (max-width: 400px) {
  .brand-logo { font-size: 17px; }
  .live-clock { font-size: 18px; }
  .btn-notif span { display: none; }
}
</style>
</head>
<body>
<div id="app">

  <header id="appHeader">
    <div class="header-brand">
      <div class="brand-logo">⏱ KRONOS</div>
      <div class="brand-sub">Elite Performance Scheduler</div>
    </div>
    <div class="header-clock">
      <div id="liveClock" class="live-clock">00:00:00</div>
      <div id="liveDate" class="live-date">—</div>
    </div>
    <div class="header-actions">
      <button id="notifToggle" class="btn-notif" title="Toggle Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="notifLabel">Enable Alerts</span>
      </button>
    </div>
  </header>

  <div class="day-nav" id="dayNav"></div>

  <div class="metrics-panel" id="metricsPanel">
    <div class="progress-ring-wrap">
      <svg class="progress-ring-svg" viewBox="0 0 130 130">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#10B981"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="65" cy="65" r="54"/>
        <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="54"
          stroke-dasharray="339.29"
          stroke-dashoffset="339.29"
          transform="rotate(-90 65 65)"/>
      </svg>
      <div class="ring-inner">
        <div class="ring-pct" id="ringPct">0%</div>
        <div class="ring-sub">Done</div>
      </div>
    </div>
    <div class="metrics-stats" id="metricsStats"></div>
    <div class="current-block-banner" id="currentBanner"></div>
  </div>

  <div class="section-label" id="schedLabel">Today's Blocks</div>
  <div class="schedule-list" id="scheduleList"></div>

</div>

<div id="toastWrap" class="toast-wrap"></div>

<div id="noteModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Block Notes</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <textarea id="noteTextarea" placeholder="Write your focus note for this block (e.g. 'Heavy legs, light jog today' or 'Focus on SAT reading section')…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-clear" id="noteClear">Clear</button>
      <button class="btn-save" id="noteSave">Save  (Ctrl+↵)</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ─── Schedule Data ─────────────────────────────────────── */
const T = (h, m) => h * 60 + m;

const TYPES = {
  wake:     { color: '#F59E0B', icon: '☀️' },
  work:     { color: '#06B6D4', icon: '💻' },
  school:   { color: '#3B82F6', icon: '🎓' },
  physical: { color: '#10B981', icon: '🏃' },
  recovery: { color: '#A78BFA', icon: '🚿' },
  meal:     { color: '#F97316', icon: '🍽️' },
  class:    { color: '#6366F1', icon: '📚' },
  break:    { color: '#64748B', icon: '☕' },
  sleep:    { color: '#1E3A8A', icon: '🌙' },
  study:    { color: '#14B8A6', icon: '📖' },
  mock:     { color: '#F43F5E', icon: '📝' },
};

const SCHEDULES = {
  MWF: {
    label: 'MWF', fullLabel: 'Mon · Wed · Fri', days: [1,3,5],
    blocks: [
      { id:'wake',      label:'Wake Up',                         start:T(5,30),  end:T(6,0),   type:'wake',     tag:'30 min'       },
      { id:'ec_work',   label:'EC Work',                         start:T(6,0),   end:T(7,0),   type:'work',     tag:'1 hr'         },
      { id:'school',    label:'School & Commute',                start:T(7,0),   end:T(16,0),  type:'school',   tag:'9 hrs'        },
      { id:'physical',  label:'Physical Activity',               start:T(16,0),  end:T(17,30), type:'physical', tag:'1.5 hrs'      },
      { id:'shower',    label:'Shower & Recovery',               start:T(17,30), end:T(18,0),  type:'recovery', tag:'30 min'       },
      { id:'dinner',    label:'Dinner / Snack Prep',             start:T(18,0),  end:T(18,30), type:'meal',     tag:'30 min'       },
      { id:'class',     label:'Online Class / Doubt Discussion', start:T(18,30), end:T(19,30), type:'class',    tag:'1 hr'         },
      { id:'postbreak', label:'Post-class Break',                start:T(19,30), end:T(20,0),  type:'break',    tag:'30 min'       },
      { id:'hindi',     label:'Hindi Reading',                   start:T(20,0),  end:T(20,30), type:'study',    tag:'30 min'       },
      { id:'winddown',  label:'Wind Down & Prep',                start:T(20,30), end:T(21,0),  type:'break',    tag:'30 min'       },
      { id:'sleep',     label:'Sleep Lock',                      start:T(21,0),  end:T(5,30),  type:'sleep',    tag:'8.5 hrs', crossesMidnight:true },
    ],
  },
  TTH: {
    label: 'T/Th', fullLabel: 'Tue · Thu', days: [2,4],
    blocks: [
      { id:'wake',      label:'Wake Up',                start:T(5,30),  end:T(6,0),   type:'wake',     tag:'30 min'  },
      { id:'ec_work',   label:'EC Work',                start:T(6,0),   end:T(7,0),   type:'work',     tag:'1 hr'    },
      { id:'school',    label:'School & Commute',       start:T(7,0),   end:T(16,0),  type:'school',   tag:'9 hrs'   },
      { id:'arrival',   label:'Arrival & Transition',   start:T(16,0),  end:T(16,15), type:'break',    tag:'15 min'  },
      { id:'hindi',     label:'Hindi Reading',          start:T(16,15), end:T(16,45), type:'study',    tag:'30 min'  },
      { id:'maths',     label:'Maths Block',            start:T(16,55), end:T(18,45), type:'class',    tag:'Travel + Class + Travel' },
      { id:'mandbreak', label:'Mandatory Break',        start:T(18,45), end:T(19,0),  type:'break',    tag:'15 min'  },
      { id:'physical',  label:'Physical Activity',      start:T(19,0),  end:T(20,30), type:'physical', tag:'1.5 hrs' },

    blocks: [

      { id:'ec1',       label:'EC Work Block 1',               start:T(7,30),  end:T(8,30),  type:'work',     tag:'1 hr'     },

      { id:'physics',   label:'Physics Class',                 start:T(14,0),  end:T(15,15), type:'class',    tag:'1.25 hrs' },
      { id:'hindi',     label:'Hindi Reading',                 start:T(15,30), end:T(16,15), type:'study',    tag:'45 min'   },
      { id:'buffer',    label:'Buffer Break / Prep',           start:T(16,15), end:T(17,0),  type:'break',    tag:'45 min'   },
      { id:'maths',     label:'Maths Class',                   start:T(17,0),  end:T(18,30), type:'class',    tag:'1.5 hrs'  },
      { id:'physical',  label:'Physical Activity',             start:T(19,0),  end:T(20,15), type:'physical', tag:'1.25 hrs' },
      { id:'recvdin',   label:'Shower & Recovery + Dinner',    start:T(20,15), end:T(21,15), type:'recovery', tag:'1 hr'     },
      { id:'ec3',       label:'EC Work Block 3',               start:T(21,15), end:T(22,30), type:'work',     tag:'1.25 hrs' },
      { id:'sleep',     label:'Sleep Lock',                    start:T(22,30), end:T(7,0),   type:'sleep',    tag:'8.5 hrs', crossesMidnight:true },
    ],

/* ─── 7-Day Map ─────────────────────────────────────────── */
// Ordered Mon→Sun; dow matches JS Date.getDay() (0=Sun)
const WEEK_DAYS = [
  { dow:1, short:'Mon', long:'Monday',    sk:'MWF' },
  { dow:2, short:'Tue', long:'Tuesday',   sk:'TTH' },
  { dow:3, short:'Wed', long:'Wednesday', sk:'MWF' },
  { dow:4, short:'Thu', long:'Thursday',  sk:'TTH' },
  { dow:5, short:'Fri', long:'Friday',    sk:'MWF' },
  { dow:6, short:'Sat', long:'Saturday',  sk:'SAT' },
  { dow:0, short:'Sun', long:'Sunday',    sk:'SUN' },
];

function dowInfo(dow) { return WEEK_DAYS.find(d => d.dow === dow); }

/* ─── State ─────────────────────────────────────────────── */
const state = {
  selectedDow: null,   // 0-6, JS day-of-week
  editingBlock: null,
  notifEnabled: false,
  sentNotifs: new Set(),
};

/* ─── Utils ─────────────────────────────────────────────── */
function todayDow() { return new Date().getDay(); }

// Calendar date string for any day-of-week in the current week
function weekDateFor(dow) {
  const t = new Date();
  const d = new Date(t);
  d.setDate(t.getDate() + (dow - t.getDay()));
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function dateStr() {
  const n = new Date();
  return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;
}

function nowMins() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}

function pad(n) { return String(n).padStart(2,'0'); }

function fmt12(mins) {
  let h = Math.floor(mins / 60) % 24, m = mins % 60;
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${pad(m)} ${ap}`;
}

function fmtDur(mins) {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins/60), m = mins%60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

function blockDur(b) {
  return b.crossesMidnight ? (1440 - b.start) + b.end : b.end - b.start;
}

function isActive(b, cm) {
  if (b.crossesMidnight) return cm >= b.start || cm < b.end;
  return cm >= b.start && cm < b.end;
}

function minsLeft(b, cm) {
  if (b.crossesMidnight)
    return cm >= b.start ? (1440 - cm) + b.end : b.end - cm;
  return b.end - cm;
}

/* ─── Storage ───────────────────────────────────────────── */
function ls(key, val) {
  if (val === undefined) {
    try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
  }
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const getComp  = (d, id)      => !!ls(`kc_${d}_${id}`);
const setComp  = (d, id, v)   => ls(`kc_${d}_${id}`, v);
// Notes are per day-of-week so Mon/Wed/Fri can have different notes
const getNote  = (dow, id)    => ls(`kn_d${dow}_${id}`) || '';
const saveNote = (dow, id, v) => ls(`kn_d${dow}_${id}`, v);

/* ─── DOM ───────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

/* ─── Notifications ─────────────────────────────────────── */
async function requestNotif() {
  if (!('Notification' in window)) {
    toast('Browser does not support notifications', 'error'); return;
  }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    state.notifEnabled = true;
    ls('k_notif', true);
    updateNotifBtn();
    toast('System notifications enabled!', 'success');
    new Notification('Kronos Active ⏱', { body: 'You will receive schedule alerts at each block transition.', silent: false });
  } else {
    toast('Notification permission denied', 'error');
  }
}

function toggleNotif() {
  if (!state.notifEnabled) requestNotif();
  else {
    state.notifEnabled = false;
    ls('k_notif', false);
    updateNotifBtn();
    toast('Notifications disabled', 'info');
  }
}

function updateNotifBtn() {
  const btn = $('notifToggle'), lbl = $('notifLabel');
  if (state.notifEnabled) {
    btn.classList.add('active'); lbl.textContent = 'Alerts On';
  } else {
    btn.classList.remove('active'); lbl.textContent = 'Enable Alerts';
  }
}

function fireNotif(title, body) {
  if (!state.notifEnabled || Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch {}
}

function checkNotifs() {
  const td = todayDow();
  const sk = dowInfo(td).sk;
  const blocks = SCHEDULES[sk].blocks;
  const ds = dateStr();
  const cm = nowMins();
  if (new Date().getSeconds() > 90) return;

  blocks.forEach((b, i) => {
    const key = `${ds}_${b.id}`;
    if (state.sentNotifs.has(key)) return;
    const diff = cm - b.start;
    if (diff >= 0 && diff <= 1) {
      state.sentNotifs.add(key);
      const next = blocks[i+1];
      const nextLabel = next ? ` Up next: ${next.label}.` : '';
      fireNotif(`⏱ ${b.label}`, `Time to start now${b.tag ? ' — ' + b.tag : ''}.${nextLabel}`);
    }
  });
}

/* ─── Progress / Metrics ────────────────────────────────── */
function renderMetrics() {
  const info = dowInfo(state.selectedDow);
  const sched = SCHEDULES[info.sk];
  const ds = weekDateFor(state.selectedDow);
  const isToday = state.selectedDow === todayDow();
  const completable = sched.blocks.filter(b => b.type !== 'sleep');
  const done = completable.filter(b => getComp(ds, b.id));
  const pct = completable.length ? Math.round(done.length / completable.length * 100) : 0;

  const circum = 339.29;
  $('ringFill').style.strokeDashoffset = circum - pct / 100 * circum;
  $('ringPct').textContent = `${pct}%`;

  $('metricsStats').innerHTML = `
    <div class="stat-item">
      <div class="stat-val">${done.length}<span>/${completable.length}</span></div>
      <div class="stat-lbl">Blocks Done</div>
    </div>
    <div class="stat-item">
      <div class="stat-val">${completable.length - done.length}</div>
      <div class="stat-lbl">Remaining</div>
    </div>
    <div class="stat-item">
      <div class="stat-val">${pct}%</div>
      <div class="stat-lbl">Execution</div>
    </div>
  `;

  const banner = $('currentBanner');
  if (isToday) {
    const cm = nowMins();
    let ai = -1;
    for (let i = 0; i < sched.blocks.length; i++)
      if (isActive(sched.blocks[i], cm)) { ai = i; break; }
    if (ai >= 0) {
      const cur = sched.blocks[ai], nxt = sched.blocks[ai+1];
      banner.style.display = 'flex';
      banner.innerHTML = `
        <div class="banner-icon">▶</div>
        <div class="banner-info">
          <div class="banner-label">Now: ${cur.label}</div>
          ${nxt ? `<div class="banner-next">Up next: ${nxt.label}</div>` : ''}
        </div>`;
    } else {
      banner.style.display = 'none';
    }
  } else {
    banner.style.display = 'none';
  }
}

/* ─── Schedule Render ───────────────────────────────────── */
function renderSchedule() {
  const dow    = state.selectedDow;
  const info   = dowInfo(dow);
  const blocks = SCHEDULES[info.sk].blocks;
  const ds     = weekDateFor(dow);
  const cm     = nowMins();
  const isToday = dow === todayDow();
  const list   = $('scheduleList');
  list.innerHTML = '';

  blocks.forEach((b, i) => {
    const done    = getComp(ds, b.id);
    const active  = isToday && isActive(b, cm);
    const note    = getNote(dow, b.id);
    const typ     = TYPES[b.type] || TYPES.break;
    const isSleep = b.type === 'sleep';

    const el = document.createElement('div');
    el.className = `block-item${active ? ' active' : ''}${done ? ' completed' : ''}`;
    el.style.setProperty('--type-color', typ.color);
    el.dataset.idx = i;

    const rem = active ? minsLeft(b, cm) : 0;
    const countdownHtml = active
      ? `<div class="block-countdown" id="cd_${i}">Ends in ${rem}m</div>` : '';
    const noteHtml = note
      ? `<div class="block-note-preview">${escHtml(note)}</div>` : '';

    const isPointInTime = b.type === 'wake' || b.type === 'sleep';
    const endStr = b.crossesMidnight ? fmt12(b.end) + ' +1d' : fmt12(b.end);
    const timeStr = isPointInTime
      ? fmt12(b.start)
      : `${fmt12(b.start)} – ${endStr}`;
    const timeDisplay = b.tag ? `${timeStr} · ${b.tag}` : timeStr;

    el.innerHTML = `
      <div class="block-body">
        <div class="block-type-icon">${typ.icon}</div>
        <div class="block-info">
          <div class="block-label">${b.label}</div>
          <div class="block-time">${timeDisplay}</div>
          ${countdownHtml}
          ${noteHtml}
        </div>
      </div>
      <div class="block-right">
        <button class="btn-note${note ? ' has-note' : ''}" data-dow="${dow}" data-id="${b.id}" data-lbl="${escAttr(b.label)}" title="Add note">
          ${note ? '<div class="note-dot"></div>' : ''}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        ${isSleep
          ? '<div class="sleep-icon">🌙</div>'
          : `<label class="block-check-wrap" title="Mark complete">
               <input type="checkbox" class="block-check" ${done ? 'checked' : ''} data-ds="${ds}" data-id="${b.id}">
               <span class="check-custom">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                   <polyline points="20 6 9 17 4 12"/>
                 </svg>
               </span>
             </label>`}
      </div>`;
    list.appendChild(el);
  });

  list.querySelectorAll('.btn-note').forEach(btn => {
    btn.addEventListener('click', () => openModal(+btn.dataset.dow, btn.dataset.id, btn.dataset.lbl));
  });
  list.querySelectorAll('.block-check').forEach(chk => {
    chk.addEventListener('change', () => {
      setComp(chk.dataset.ds, chk.dataset.id, chk.checked);
      chk.closest('.block-item').classList.toggle('completed', chk.checked);
      renderMetrics();
      const name = chk.dataset.id.replace(/_/g, ' ');
      toast(chk.checked ? `✓ ${name} complete` : `${name} unmarked`, chk.checked ? 'success' : 'info');
    });
  });
}

/* ─── Day Tabs ──────────────────────────────────────────── */
function renderDayTabs() {
  const nav = $('dayNav');
  nav.innerHTML = '';
  const td = todayDow();
  WEEK_DAYS.forEach(day => {
    const btn = document.createElement('button');
    const isCurrent = day.dow === state.selectedDow;
    const isToday   = day.dow === td;
    btn.className = `day-tab${isCurrent ? ' active' : ''}`;
    btn.innerHTML = `
      <span class="tab-label">${day.short}</span>
      <span class="tab-sub">${day.long}</span>
      ${isToday ? '<span class="tab-today">TODAY</span>' : ''}`;
    btn.addEventListener('click', () => {
      state.selectedDow = day.dow;
      renderAll();
    });
    nav.appendChild(btn);
  });
}

function renderAll() {
  renderDayTabs();
  renderMetrics();
  renderSchedule();
  const info = dowInfo(state.selectedDow);
  const isToday = state.selectedDow === todayDow();
  $('schedLabel').textContent = isToday ? "Today's Blocks" : `${info.long} Schedule`;
}

/* ─── Live Clock & Countdowns ───────────────────────────── */
function tickClock() {
  const n = new Date();
  $('liveClock').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('liveDate').textContent = `${DAYS[n.getDay()]}, ${MONS[n.getMonth()]} ${n.getDate()} ${n.getFullYear()}`;
}

function tickCountdowns() {
  if (state.selectedDow === null) return;
  const isToday = state.selectedDow === todayDow();
  if (!isToday) return;
  const blocks = SCHEDULES[dowInfo(state.selectedDow).sk].blocks;

  const cm = nowMins();
  const now = new Date();
  const sec = now.getSeconds();
  let needsRerender = false;

  blocks.forEach((b, i) => {
    const active = isActive(b, cm);
    const el = document.getElementById(`cd_${i}`);

    if (active && !el) { needsRerender = true; return; }
    if (!active && el) { needsRerender = true; return; }
    if (!active || !el) return;

    const rem = minsLeft(b, cm);
    if (rem <= 1) {
      el.textContent = `Ends in ${Math.max(0, 60 - sec)}s`;
    } else {
      el.textContent = `Ends in ${rem}m`;
    }
  });

  if (needsRerender) {
    renderSchedule();
    renderMetrics();
  }
}

/* ─── Toast ─────────────────────────────────────────────── */
function toast(msg, type = 'info') {
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 350);
  }, 3200);
}

/* ─── Note Modal ────────────────────────────────────────── */
function openModal(dow, id, label) {
  state.editingBlock = { dow, id };
  $('modalTitle').textContent = `Notes — ${label}`;
  $('noteTextarea').value = getNote(dow, id);
  $('noteModal').removeAttribute('hidden');
  setTimeout(() => $('noteTextarea').focus(), 50);
}

function closeModal() {
  $('noteModal').setAttribute('hidden', '');
  state.editingBlock = null;
}

function doSaveNote() {
  if (!state.editingBlock) return;
  const { dow, id } = state.editingBlock;
  const text = $('noteTextarea').value.trim();
  saveNote(dow, id, text);
  closeModal();
  renderSchedule();
  toast(text ? '📝 Note saved' : 'Note cleared', 'success');
}

/* ─── Escape helpers ────────────────────────────────────── */
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }

/* ─── Init ──────────────────────────────────────────────── */
function init() {
  const saved = ls('k_notif');
  if (saved && Notification.permission === 'granted') {
    state.notifEnabled = true;
  }

  state.selectedDow = todayDow();
  renderAll();
  tickClock();
  updateNotifBtn();

  $('notifToggle').addEventListener('click', toggleNotif);
  $('modalClose').addEventListener('click', closeModal);
  $('noteSave').addEventListener('click', doSaveNote);
  $('noteClear').addEventListener('click', () => { $('noteTextarea').value = ''; });
  $('noteModal').addEventListener('click', e => { if (e.target === $('noteModal')) closeModal(); });
  $('noteTextarea').addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) doSaveNote(); });

  setInterval(tickClock, 1000);
  setInterval(tickCountdowns, 1000);
  setInterval(() => { checkNotifs(); }, 30000);

  // Also check immediately in case a block just started
  checkNotifs();
}

init();
</script>

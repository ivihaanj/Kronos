<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1321"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tickGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="handGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="512" cy="512" r="512"/>
    </clipPath>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="512" cy="512" r="512" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="512" fill="url(#centerGlow)"/>
  <!-- Outer decorative ring -->
  <circle cx="512" cy="512" r="490" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <!-- Main clock ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="408" fill="none" stroke="rgba(6,182,212,0.08)" stroke-width="1.5"/>
  <circle cx="512" cy="512" r="407" fill="rgba(6,182,212,0.025)"/>
  <!-- Hour ticks -->
  <line x1="512" y1="100" x2="512" y2="148" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="727" y1="155" x2="700" y2="201" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="869" y1="297" x2="843" y2="343" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="924" y1="512" x2="876" y2="512" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="869" y1="727" x2="843" y2="681" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="727" y1="869" x2="700" y2="823" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="512" y1="924" x2="512" y2="876" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="297" y1="869" x2="324" y2="823" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="727" x2="182" y2="681" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="512" x2="148" y2="512" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="155" y1="297" x2="182" y2="343" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="297" y1="155" x2="324" y2="201" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- Minute hand -->
  <line x1="512" y1="512" x2="512" y2="195" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" filter="url(#handGlow)"/>
  <!-- Hour hand -->
  <line x1="512" y1="512" x2="330" y2="355" stroke="#10B981" stroke-width="22" stroke-linecap="round" filter="url(#handGlow)"/>
  <!-- Second hand accent -->
  <line x1="512" y1="540" x2="512" y2="165" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="512" cy="512" r="28" fill="#0B0F19"/>
  <circle cx="512" cy="512" r="22" fill="url(#ringGrad)" filter="url(#handGlow)"/>
  <circle cx="512" cy="512" r="10" fill="#FFFFFF" opacity="0.9"/>
  <!-- KRONOS text -->
  <text x="512" y="690"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="68" letter-spacing="14"
        text-anchor="middle"
        fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.85">KRONOS</text>
</svg>

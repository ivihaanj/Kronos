<!-- Adaptive icon foreground — 108dp canvas, 72dp safe zone, transparent background -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="handGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tickGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Main clock ring -->
  <circle cx="216" cy="216" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="216" cy="216" r="158" fill="rgba(6,182,212,0.04)"/>
  <!-- Hour ticks -->
  <line x1="216" y1="55"  x2="216" y2="74"  stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="307" y1="78"  x2="296" y2="97"  stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="360" y1="133" x2="349" y2="152" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="377" y1="216" x2="358" y2="216" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="360" y1="299" x2="349" y2="280" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="307" y1="354" x2="296" y2="335" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="216" y1="377" x2="216" y2="358" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="125" y1="354" x2="136" y2="335" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="72"  y1="299" x2="83"  y2="280" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="55"  y1="216" x2="74"  y2="216" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" filter="url(#tickGlow)"/>
  <line x1="72"  y1="133" x2="83"  y2="152" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="125" y1="78"  x2="136" y2="97"  stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Minute hand -->
  <line x1="216" y1="216" x2="216" y2="85"  stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" filter="url(#handGlow)"/>
  <!-- Hour hand -->
  <line x1="216" y1="216" x2="140" y2="150" stroke="#10B981"       stroke-width="10" stroke-linecap="round" filter="url(#handGlow)"/>
  <!-- Second hand -->
  <line x1="216" y1="228" x2="216" y2="72"  stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="216" cy="216" r="12" fill="#0B0F19"/>
  <circle cx="216" cy="216" r="9"  fill="url(#ringGrad)" filter="url(#handGlow)"/>
  <circle cx="216" cy="216" r="4"  fill="#FFFFFF" opacity="0.9"/>
</svg>
